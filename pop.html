
<!DOCTYPE html>
<html>
<head>
    <title>My Personal Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            text-align: center;
        }

        .profile {
            background-color: white;
            width: 450px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: darkblue;
        }

        img {
            width: 350px;
            height: 200px;
            border-radius: 10px;
        }

        p {
            font-size: 18px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>My Personal Profile</h1>

        <img src="college.jpg" alt="College Image">

        <h2>Student Details</h2>

        <p><b>Name:</b> Your Name</p>

        <p><b>Age:</b> Your Age</p>

        <p><b>Course:</b> Your Course</p>

        <p><b>College:</b> Your College Name</p>

    </div>

</body>
</html>
